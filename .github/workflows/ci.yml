name: CI

# Every test runs LOCALLY before the push (`npm run verify`, enforced by .githooks/pre-push), so a
# push to main only deploys. Thomas, Nov 2026: tests before the push, never during the deploy.
on:
  push:
    branches: [main]

# Never cancel a run on main: it may be mid-deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
