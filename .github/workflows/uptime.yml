name: Uptime

# Every 10 minutes: is the live app the right page, does its JS bundle load, does the backend
# answer? A SPA can be "up" and blank (13-MONITORING). GET only — the one standing exception to
# "never touch production", agreed when this workflow was added. A failed run emails whoever
# last edited this schedule.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      BRAND: Mi fotocall
      HEALTH_URL: https://jzhysqrbcnmekikbhyou.supabase.co/auth/v1/health
      HEALTH_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Site, bundle and backend respond
        run: |
          if [ -z "$SITE_URL" ]; then echo "::error::set the SITE_URL repository variable"; exit 1; fi
          check() {
            html=$(curl -fsS --max-time 15 "$SITE_URL") || return 1
            echo "$html" | grep -q "<title>[^<]*$BRAND" || { echo "wrong page"; return 1; }
            js=$(echo "$html" | grep -oE '/assets/index-[^"]+\.js' | head -1)
            [ -n "$js" ] || { echo "no bundle referenced"; return 1; }
            curl -fsS --max-time 15 -o /dev/null "$SITE_URL$js" || { echo "bundle $js does not load"; return 1; }
            curl -fsS --max-time 15 -o /dev/null -H "apikey: $HEALTH_KEY" "$HEALTH_URL" || { echo "backend down"; return 1; }
          }
          for attempt in 1 2 3; do
            check && { echo "up"; exit 0; }
            [ "$attempt" -lt 3 ] && sleep 20
          done
          echo "::error::$SITE_URL is down or blank"; exit 1
