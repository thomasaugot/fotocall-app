name: Backup

# Daily copy of the album (rows + files) as a workflow artifact, kept 90 days. Supabase backs up
# neither Storage files nor, on the free plan, the database (13-MONITORING → Backups).
# Reads production, never writes it. Needs the SUPABASE_SERVICE_ROLE_KEY repository secret.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  album:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: node scripts/backup-photos.mjs backup
        env:
          SUPABASE_URL: https://jzhysqrbcnmekikbhyou.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        with: { name: "album-${{ github.run_id }}", path: backup, retention-days: 90 }
